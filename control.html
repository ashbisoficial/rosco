<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rosco — Panel de control</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
  <link rel="stylesheet" href="css/control.css?v=3" />
</head>
<body>
  <header class="topbar">
    <h1>🎯 Panel de control del Rosco</h1>
    <div id="roomBadge" class="room-badge" hidden>
      Sala: <strong id="roomCodeLabel"></strong>
      <button id="copyOverlayLink" type="button">Copiar enlace del overlay</button>
    </div>
  </header>

  <!-- Pantalla de configuración: se arma la partida antes de empezar -->
  <section id="setupScreen" class="panel">
    <div class="setup-row">
      <label id="roomInputLabel">
        Código de sala
        <input id="roomInput" type="text" maxlength="12" placeholder="se genera solo si lo dejás vacío" />
      </label>
      <label>
        Duración (minutos)
        <input id="durationInput" type="number" min="0.5" step="0.5" value="4" />
      </label>
      <button id="loadSavedBtn" type="button">Cargar últimas preguntas guardadas</button>
      <button id="importBtn" type="button">Importar JSON</button>
      <button id="exportBtn" type="button">Exportar JSON</button>
      <input id="importFile" type="file" accept="application/json" hidden />
    </div>

    <table class="letters-table">
      <thead>
        <tr>
          <th>Letra</th>
          <th>Tipo</th>
          <th>Pregunta</th>
          <th>Respuesta (referencia)</th>
        </tr>
      </thead>
      <tbody id="setupTableBody"></tbody>
    </table>

    <button id="startGameBtn" type="button" class="primary">Crear partida y empezar a jugar</button>
  </section>

  <!-- Pantalla de juego: acá se controla el rosco en vivo -->
  <section id="gameScreen" class="panel" hidden>
    <div class="game-toolbar">
      <div class="timer-controls">
        <span id="timerLabel" class="timer-label">04:00</span>
        <button id="timerStartBtn" type="button">▶️ Iniciar</button>
        <button id="timerPauseBtn" type="button">⏸️ Pausar</button>
        <button id="timerResetBtn" type="button">🔄 Reiniciar tiempo</button>
      </div>
      <div class="score-summary">
        ✅ <span id="scoreCorrect">0</span>
        &nbsp;❌ <span id="scoreWrong">0</span>
        &nbsp;⏭️ <span id="scorePass">0</span>
        &nbsp;⬜ <span id="scorePending">26</span>
      </div>
      <button id="editQuestionsBtn" type="button" title="Editá el texto de las preguntas sin perder la sala, el progreso ni el enlace del overlay">✏️ Editar preguntas</button>
      <button id="restartGameBtn" type="button" title="Vuelve a poner todas las letras en pendiente y el reloj en cero, con las mismas preguntas y la misma sala">🔁 Reiniciar partida</button>
      <button id="newGameBtn" type="button" title="Vuelve a la pantalla de configuración para armar otra tanda de preguntas">Nueva partida</button>
    </div>

    <ul id="lettersList" class="letters-list"></ul>
  </section>

  <script type="module" src="js/control.js?v=3"></script>
</body>
</html>
