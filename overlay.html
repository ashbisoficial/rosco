<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rosco — Overlay</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
  <link rel="stylesheet" href="css/overlay.css?v=4" />
</head>
<body>
  <!-- Se muestra solo si no vino ?room=CODIGO en la URL (para probar sin OBS) -->
  <div id="connectForm" class="connect-form">
    <label>
      Código de sala
      <input id="roomInputOverlay" type="text" maxlength="12" placeholder="ABC123" />
    </label>
    <button id="connectBtn" type="button">Conectar</button>
  </div>

  <div id="overlayContent" class="overlay-content" hidden>
    <div id="topTimer" class="top-timer">04:00</div>
    <div id="roscoStage" class="rosco-stage">
      <div id="roscoCircle" class="rosco-circle"></div>
      <div class="rosco-center">
        <div id="centerClue" class="center-clue"></div>
        <div id="centerScore" class="center-score"></div>
      </div>
      <div id="finalBanner" class="final-banner" hidden>
        <div class="final-title">¡Rosco terminado!</div>
        <div id="finalStats" class="final-stats"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/overlay.js?v=4"></script>
</body>
</html>
